<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reto: Filtrado de tablas</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 20px auto; padding: 0 10px; }
    fieldset { margin-bottom: 15px; }
    input, select, button { margin: 4px 2px; padding: 4px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #000; padding: 6px; text-align: left; }
  </style>
</head>
<body>
  <h1>Reto: Filtrado de tablas</h1>
  <p>Natalia Jaquelin Sánchez Morales - Equipo Click</p>

  <fieldset>
    <legend>Buscar</legend>
    <input type="text" id="filtro" placeholder="Escribe para filtrar...">
    <select id="columna">
      <option value="-1">Todas las columnas</option>
      <option value="0">Nombre</option>
      <option value="1">Edad</option>
      <option value="2">Ciudad</option>
    </select>
    <button id="limpiar">Limpiar</button>
    <p id="contador"></p>
  </fieldset>

  <table id="tabla">
    <thead>
      <tr><th>Nombre</th><th>Edad</th><th>Ciudad</th><th>Acción</th></tr>
    </thead>
    <tbody></tbody>
  </table>
  <p id="mensaje"><b></b></p>

  <fieldset>
    <legend>Agregar persona</legend>
    <input type="text" id="nNombre" placeholder="Nombre">
    <input type="number" id="nEdad" placeholder="Edad" min="1">
    <input type="text" id="nCiudad" placeholder="Ciudad">
    <button id="agregar">Agregar</button>
    <p id="error"></p>
  </fieldset>

  <script>
    const personas = [
      { nombre: "Juan",  edad: 25, ciudad: "Madrid" },
      { nombre: "Ana",   edad: 30, ciudad: "Barcelona" },
      { nombre: "Jose",  edad: 32, ciudad: "Granada" },
      { nombre: "Pedro", edad: 35, ciudad: "Valencia" },
      { nombre: "Lucía", edad: 28, ciudad: "Sevilla" }
    ];

    const filtro   = document.getElementById("filtro");
    const columna  = document.getElementById("columna");
    const contador = document.getElementById("contador");
    const mensaje  = document.getElementById("mensaje");
    const error    = document.getElementById("error");
    const tbody    = document.querySelector("#tabla tbody");

    function normalizar(texto) {
      return texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
    }

    function crearFila(p) {
      const tr = document.createElement("tr");
      [p.nombre, p.edad, p.ciudad].forEach(function (valor) {
        const td = document.createElement("td");
        td.textContent = valor;
        tr.appendChild(td);
      });
      const tdAccion = document.createElement("td");
      const btn = document.createElement("button");
      btn.textContent = "Eliminar";
      btn.addEventListener("click", function () {
        tr.remove();
        filterTable();
      });
      tdAccion.appendChild(btn);
      tr.appendChild(tdAccion);
      tbody.appendChild(tr);
    }

    function filterTable() {
      const busqueda = normalizar(filtro.value);
      const col = parseInt(columna.value);
      const filas = tbody.querySelectorAll("tr");
      let visibles = 0;

      filas.forEach(function (fila) {
        const celdas = Array.from(fila.cells).slice(0, 3);
        const texto = col === -1
          ? celdas.map(c => c.textContent).join(" ")
          : celdas[col].textContent;
        const coincide = normalizar(texto).includes(busqueda);
        fila.style.display = coincide ? "" : "none";
        if (coincide) visibles++;
      });

      contador.textContent = "Mostrando " + visibles + " de " + filas.length;
      mensaje.textContent = (filas.length > 0 && visibles === 0) ? "No hay coincidencias." : "";
    }

    function agregarPersona() {
      const nombre = document.getElementById("nNombre").value.trim();
      const edad   = parseInt(document.getElementById("nEdad").value);
      const ciudad = document.getElementById("nCiudad").value.trim();

      if (nombre === "" || ciudad === "" || isNaN(edad) || edad <= 0) {
        error.textContent = "Completa nombre, ciudad y una edad mayor a 0.";
        return;
      }
      error.textContent = "";
      crearFila({ nombre: nombre, edad: edad, ciudad: ciudad });
      document.getElementById("nNombre").value = "";
      document.getElementById("nEdad").value = "";
      document.getElementById("nCiudad").value = "";
      filterTable();
    }

    filtro.addEventListener("input", filterTable);
    columna.addEventListener("change", filterTable);
    document.getElementById("limpiar").addEventListener("click", function () {
      filtro.value = "";
      columna.value = "-1";
      filterTable();
    });
    document.getElementById("agregar").addEventListener("click", agregarPersona);

    personas.forEach(crearFila);
    filterTable();
  </script>
</body>
</html>
